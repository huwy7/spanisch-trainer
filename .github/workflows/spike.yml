# Temporary workflow for the M0b data spike. Removed when M0b is done.
name: Data spike

on:
  push:
    branches: ['claude/**']
    paths: ['scripts/spike/**', '.github/workflows/spike.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@v4
        with:
          path: .cache/spike
          key: spike-downloads-v1
      - run: node --max-old-space-size=8192 scripts/spike/analyze.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-report
          path: .cache/spike/report.md
